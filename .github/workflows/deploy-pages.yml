name: Deploy VGFA to GitHub Pages (24/7 Free Forever)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VGFA for GitHub Pages
        env:
          VITE_BASE: /video-game-for-all/
        run: pnpm -r build

      - name: Bundle Same-Origin Open-Source PS2 WASM Cores into Pages Artifact
        run: |
          mkdir -p apps/web/dist/ps2-core apps/web/dist/ps2-turbo
          curl -fsSL https://playjs.purei.org/Play.js -o apps/web/dist/ps2-core/Play.js
          curl -fsSL https://playjs.purei.org/Play.wasm -o apps/web/dist/ps2-core/Play.wasm
          curl -fsSL https://tabstationtoo.github.io/TabStationToo/pcsx2-wasm.js -o apps/web/dist/ps2-turbo/pcsx2-wasm.js
          curl -fsSL https://tabstationtoo.github.io/TabStationToo/pcsx2-wasm.wasm -o apps/web/dist/ps2-turbo/pcsx2-wasm.wasm
          curl -fsSL https://tabstationtoo.github.io/TabStationToo/pcsx2-wasm.data -o apps/web/dist/ps2-turbo/pcsx2-wasm.data
          curl -fsSL https://tabstationtoo.github.io/TabStationToo/disc-worker.js -o apps/web/dist/ps2-turbo/disc-worker.js
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll
          ls -lh apps/web/dist/ps2-core apps/web/dist/ps2-turbo

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

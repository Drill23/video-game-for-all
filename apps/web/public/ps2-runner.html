<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VGFA PlayStation 2 Runtime (Nexus OPFS)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05060a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #stage {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center;
      background: #000;
      overflow: hidden;
    }
    #outputCanvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 8, 13, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 181, 71, 0.25);
      border-top-color: #ffb547;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prog-track {
      width: 100%;
      max-width: 340px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: none;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffb547, #38bdf8);
      transition: width 0.2s ease;
    }
    #hud {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: #0d111a;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #cbd5e1;
      flex-wrap: wrap;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #ffb547, #ff6b6b);
      color: #07080d;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .hud-btn {
      background: #141926;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .hud-btn:hover { border-color: #ffb547; }
    #warnBanner {
      display: none;
      padding: 5px 12px;
      background: rgba(255, 181, 71, 0.14);
      color: #fde68a;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="warnBanner"></div>
  <div id="stage">
    <canvas id="outputCanvas" width="640" height="480" tabindex="0"></canvas>
    <div id="overlay">
      <div class="spinner" id="spinner"></div>
      <strong id="statusTitle" style="font-size: 16px;">Inicializando VGFA Nexus PS2...</strong>
      <div id="statusSub" style="font-size: 12px; color: #94a3b8; max-width: 460px; line-height: 1.5;">
        Carregando Play.wasm (2,2 MB • Zero BIOS) acoplado ao Disco Virtual OPFS NVMe Anti-503.
      </div>
      <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
      <label id="manualPickLabel" class="btn" style="display:none;">
        📂 Escolher ISO / CSO / CHD / ELF Local
        <input id="manualPick" type="file" accept=".iso,.cso,.chd,.bin,.elf" style="display:none;" />
      </label>
    </div>
  </div>
  <div id="hud">
    <span id="hudStatus">Núcleo PS2 Nexus: iniciando...</span>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <span id="hudStats" class="mono">OPFS Virtual SSD: aguardando disco</span>
      <button id="fsBtn" class="hud-btn" title="Tela Cheia">⛶ Tela Cheia</button>
    </div>
  </div>

  <script type="module">
    import { VgfaOpfsDiscDevice } from './vgfa-opfs-disc.js';

    const overlay = document.getElementById('overlay');
    const spinner = document.getElementById('spinner');
    const statusTitle = document.getElementById('statusTitle');
    const statusSub = document.getElementById('statusSub');
    const progTrack = document.getElementById('progTrack');
    const progFill = document.getElementById('progFill');
    const manualPickLabel = document.getElementById('manualPickLabel');
    const manualPick = document.getElementById('manualPick');
    const hudStatus = document.getElementById('hudStatus');
    const hudStats = document.getElementById('hudStats');
    const warnBanner = document.getElementById('warnBanner');
    const fsBtn = document.getElementById('fsBtn');
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('outputCanvas');

    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else stage.requestFullscreen?.().catch(() => {});
    });

    function setStatus(title, sub, showSpin = true, showPicker = false, pct = -1) {
      statusTitle.textContent = title;
      statusSub.textContent = sub || '';
      spinner.style.display = showSpin ? 'block' : 'none';
      manualPickLabel.style.display = showPicker ? 'inline-block' : 'none';
      if (pct >= 0) {
        progTrack.style.display = 'block';
        progFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
      } else {
        progTrack.style.display = 'none';
      }
      overlay.classList.remove('hidden');
      hudStatus.textContent = title;
    }

    function hideOverlay(msg) {
      overlay.classList.add('hidden');
      hudStatus.textContent = msg || 'PlayStation 2 em execução';
      canvas.focus();
    }

    async function resolvePlayCoreBase() {
      // 1. Tenta caminho estático relativo (GitHub Pages Fastly CDN / produção)
      const staticBase = new URL('./ps2-core/', window.location.href).href;
      try {
        const probe = await fetch(staticBase + 'Play.js', { method: 'HEAD' });
        if (probe.ok) return staticBase;
      } catch {}
      // 2. Fallback servidor local /api/ps2-core/
      return window.location.origin + '/api/ps2-core/';
    }

    let playModule = null;
    let discDevice = null;
    let booted = false;
    let pendingBoot = null;
    let currentFps = 0;

    function renderTelemetry(st) {
      if (!st) return;
      const mb = (st.bytesDownloaded / (1024 * 1024)).toFixed(1);
      const totalGb = (st.size / (1024 * 1024 * 1024)).toFixed(2);
      const modeLabel = st.mode === 'opfs-file' ? 'OPFS NVMe 100%' : st.opfsEnabled ? 'OPFS+Range' : 'Range';
      const retryNote = st.retries > 0 ? ` • ${st.retries} recup.` : '';
      hudStats.textContent = `${modeLabel}: ${mb} MB / ${totalGb} GB • ${st.mbps.toFixed(1)} MB/s • Cache ${st.hitPct}% • RAM ${st.ramChunks}MB${retryNote} • ${currentFps} FPS`;
    }

    let frameCount = 0;
    let fpsStart = performance.now();
    function measureFps(ts) {
      frameCount++;
      if (ts - fpsStart >= 1000) {
        currentFps = Math.round((frameCount * 1000) / (ts - fpsStart));
        frameCount = 0;
        fpsStart = ts;
        if (discDevice && booted) renderTelemetry(discDevice.getStats());
      }
      requestAnimationFrame(measureFps);
    }
    requestAnimationFrame(measureFps);

    async function initPlayCore() {
      if (typeof SharedArrayBuffer === 'undefined' || !globalThis.crossOriginIsolated) {
        setStatus(
          'Ativando isolamento SharedArrayBuffer...',
          'Recarregue a página uma vez (Cmd+Shift+R) para ativar o Service Worker COOP/COEP.',
          false,
          false,
        );
        return;
      }

      try {
        const base = await resolvePlayCoreBase();
        const mod = await import(base + 'Play.js');
        const PlayFactory = mod.default;

        playModule = await PlayFactory({
          locateFile: (file) => base + file,
          mainScriptUrlOrBlob: base + 'Play.js',
          canvas,
        });

        try { playModule.FS.mkdir('/work'); } catch {}
        discDevice = new VgfaOpfsDiscDevice(playModule, {
          onTelemetry: renderTelemetry,
          onWarning: (msg) => {
            warnBanner.textContent = '⚠️ ' + msg;
            warnBanner.style.display = 'block';
          },
        });
        playModule.discImageDevice = discDevice;
        playModule.ccall('initVm', '', [], []);

        if (pendingBoot) {
          const job = pendingBoot;
          pendingBoot = null;
          await bootPayload(job);
        } else {
          setStatus(
            'Núcleo PS2 Nexus (Zero BIOS) pronto!',
            'Selecione uma ISO/CSO/CHD/ELF de PlayStation 2 ou use o botão Turbo 60 FPS acima.',
            false,
            true,
          );
        }
      } catch (err) {
        console.error('[VGFA-PS2] Falha ao iniciar Play.wasm:', err);
        setStatus('Erro ao iniciar o núcleo PS2', String(err && err.message ? err.message : err), false, false);
      }
    }

    async function bootPayload(job) {
      if (!playModule || !discDevice) {
        pendingBoot = job;
        return;
      }
      if (booted) return;

      try {
        const name = (job.filename || 'disc.iso').trim();
        const isElf = name.toLowerCase().endsWith('.elf');

        if (job.file) {
          setStatus(`Iniciando ${name}...`, 'Montando imagem local (zero cópia para RAM).', true, false);
          if (isElf) {
            const bytes = new Uint8Array(await job.file.arrayBuffer());
            const fd = playModule.FS.open(name, 'w+');
            playModule.FS.write(fd, bytes, 0, bytes.length, 0);
            playModule.FS.close(fd);
            playModule.bootElf(name);
          } else {
            discDevice.setLocalFile(job.file);
            playModule.bootDiscImage(name);
          }
          booted = true;
          hideOverlay(`PS2 Nexus: ${name} (Local NVMe)`);
          return;
        }

        if (job.url) {
          setStatus(
            `Conectando ${name} ao Disco Virtual OPFS...`,
            'Streaming controlado anti-503 com cache persistente em SSD NVMe (RAM máxima 24 MB).',
            true,
            false,
          );
          if (isElf) {
            const res = await globalThis.fetch(job.url);
            const bytes = new Uint8Array(await res.arrayBuffer());
            const fd = playModule.FS.open(name, 'w+');
            playModule.FS.write(fd, bytes, 0, bytes.length, 0);
            playModule.FS.close(fd);
            playModule.bootElf(name);
          } else {
            await discDevice.setRemoteUrl(job.url, (p) => {
              const mb = (p.loaded / (1024 * 1024)).toFixed(1);
              const tot = p.total ? (p.total / (1024 * 1024)).toFixed(0) + ' MB' : '';
              setStatus(
                `Gravando ${name} no SSD Virtual OPFS (${p.percent}%)...`,
                `${mb} MB ${tot ? '/ ' + tot : ''} • ${p.mbps.toFixed(1)} MB/s — Salvo 1 única vez no navegador (0 RAM)!`,
                true,
                false,
                p.percent,
              );
            });
            renderTelemetry(discDevice.getStats());
            playModule.bootDiscImage(name);
          }
          booted = true;
          hideOverlay(`PS2 Nexus: ${name}`);
        }
      } catch (err) {
        console.error('[VGFA-PS2] Erro no boot:', err);
        setStatus('Não foi possível iniciar este disco', String(err && err.message ? err.message : err), false, true);
      }
    }

    manualPick.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) void bootPayload({ file: f, filename: f.name });
    });

    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'vgfa-ps2-boot') {
        void bootPayload(d);
      } else if (d.type === 'vgfa-ps2-key') {
        const keyEv = new KeyboardEvent(d.down ? 'keydown' : 'keyup', {
          key: d.key,
          code: d.code,
          keyCode: d.keyCode,
          which: d.keyCode,
          bubbles: true,
          cancelable: true,
        });
        window.dispatchEvent(keyEv);
        canvas.dispatchEvent(keyEv);
      }
    });

    void initPlayCore().then(() => {
      window.parent?.postMessage({ type: 'vgfa-ps2-runner-ready' }, '*');
    });
  </script>
</body>
</html>
